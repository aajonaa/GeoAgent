[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geological-agent-local"
version = "0.1.1"
description = "Local single-agent LangGraph harness for geological research"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "jsonschema>=4.23,<5", "httpx>=0.27,<1", "PyYAML>=6,<7", "tiktoken==0.12.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
observability = ["langsmith>=0.14,<1"]
web = ["fastapi==0.115.5", "uvicorn==0.32.1", "cryptography>=46,<48", "defusedxml==0.7.1", "tinycss2==1.5.1"]
hitl = ["langgraph-checkpoint-sqlite>=2,<4"]
context-postgres = ["psycopg[binary]==3.3.6", "psycopg-pool==3.3.3", "langgraph-checkpoint-postgres==3.1.2"]
professional = ["numpy==2.1.3", "pandas==2.2.3", "Pillow==11.1.0", "rasterio==1.4.3", "requests==2.32.3", "openpyxl==3.1.5", "scipy==1.15.3", "PyKrige==1.7.3", "exactextract==0.3.0", "pymannkendall==1.4.3", "shapely==2.1.2"]

[project.scripts]
geological-agent = "geological_agent.cli:main"
geological-agent-web = "geological_agent.web_server:main"
geological-agent-team = "geological_agent.team.server:main"

[tool.setuptools.packages.find]
include = ["geological_agent*", "legacy", "legacy.ToolsAgent", "legacy.ToolsAgent.ToolsFuns", "legacy.ToolsAgent.ToolsFuns.Geoscience", "legacy.ToolsAgent.ToolsFuns.GeoEval", "legacy.ToolsAgent.ToolsFuns.Geo", "catalog"]

[tool.setuptools.package-data]
geological_agent = ["web/*", "web/vendor/*", "team/web/*"]
catalog = ["registry.json", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests_local"]
pythonpath = ["."]
